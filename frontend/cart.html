<!DOCTYPE html>
<html lang="ru">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Корзина — StyleFit</title>
    <link rel="stylesheet" href="{% static 'style.css' %}">
    <link rel="stylesheet" href="{% static 'cart.css' %}">
    <script src="{% static 'cart-page.js' %}" defer></script>
</head>
<body>
    <header class="cart-header">
        <a href="/" class="cart-logo">StyleFit</a>
        <a href="/" class="cart-back">← Продолжить покупки</a>
    </header>

    <main class="cart-page">
        <h1>Моя корзина</h1>

        <div id="cart-message" class="cart-message"></div>

        <section class="cart-layout">
            <div>
                <div id="cart-items"></div>
            </div>

            <aside class="checkout-card">
                <h2>Оформление заказа</h2>

                <div class="cart-total">
                    <span>Итого:</span>
                    <strong id="cart-total">0 ₽</strong>
                </div>

                <form id="checkout-form">
                    <label for="full-name">ФИО</label>
                    <input id="full-name" name="full_name"
                           type="text" required maxlength="200">

                    <label for="phone">Телефон</label>
                    <input id="phone" name="phone"
                           type="tel" required maxlength="20"
                           placeholder="+7 900 000-00-00">

                    <label for="email">Электронная почта</label>
                    <input id="email" name="email"
                           type="email" required>

                    <label for="city">Город</label>
                    <input id="city" name="city"
                           type="text" required maxlength="100">

                    <label for="address">Улица, дом, квартира</label>
                    <textarea id="address" name="address"
                              required maxlength="1000"
                              rows="3"></textarea>

                    <label for="comment">Комментарий к заказу</label>
                    <textarea id="comment" name="comment"
                              maxlength="1000" rows="2"></textarea>

                    <button id="checkout-button"
                            class="checkout-button" type="submit">
                        Подтвердить заказ
                    </button>
                </form>

                <p class="checkout-note">
                    Демонстрационное оформление. Оплата не производится.
                </p>
            </aside>
        </section>
    </main>
</body>
</html>
